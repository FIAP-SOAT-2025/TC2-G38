apiVersion: apps/v1
kind: Deployment
metadata:
  name: lanchonete-api
  namespace: lanchonete-tc2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lanchonete-api
  template:
    metadata:
      labels:
        app: lanchonete-api
    spec:
      containers:
      - name: api
        image: fealves/tc2:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: api-configmap
        - secretRef:
            name: api-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
